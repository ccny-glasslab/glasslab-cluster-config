# /etc/haproxy/haproxy.cfg on the Azure edge VM.
# Public 80/443 for glasslab.org and www.glasslab.org (never exam.glasslab.org), relayed as raw TCP over WireGuard to the
# glasslab.org gateway (100.64.77.1). TLS is NOT terminated here: the
# certificate and key stay on the gateway. send-proxy-v2 prepends a PROXY
# header carrying the visitor's real address, which Apache's mod_remoteip reads.
global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend glasslab_https
    bind :443
    # Only relay TLS for glasslab.org and www. exam.glasslab.org is never relayed.
    tcp-request inspect-delay 5s
    tcp-request content reject unless { req_ssl_hello_type 1 }
    tcp-request content reject unless { req_ssl_sni -i glasslab.org www.glasslab.org }
    default_backend gateway_https

frontend glasslab_http
    bind :80
    default_backend gateway_http

# No health checks: Apache 2.4 mod_remoteip rejects the PROXY "LOCAL" command
# that HAProxy health checks send, and with one server they change nothing.
backend gateway_https
    server gateway 100.64.77.1:443 send-proxy-v2

backend gateway_http
    server gateway 100.64.77.1:80 send-proxy-v2
