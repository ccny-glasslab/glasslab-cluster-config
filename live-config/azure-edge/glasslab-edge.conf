# /etc/apache2/sites-available/glasslab-edge.conf on the glasslab.org gateway.
#
# glasslab.org and www.glasslab.org as seen from the internet. Their DNS points
# at the Azure edge VM, whose HAProxy relays raw TCP over WireGuard
# (100.64.77.2 -> 100.64.77.1) and prepends a PROXY v2 header. TLS ends here,
# not on the VM. mod_remoteip reads the header, so "Require ip" and the logs see
# each visitor's real address. A connection to 100.64.77.1 without the header
# is refused.
#
# The exam hub is NEVER served through the relay (weak exam passwords). It
# lives at https://exam.glasslab.org/exam/, whose DNS points straight at the
# gateway, so it stays campus-only behind the CCNY border and its own
# Require ip. Here /exam only redirects there.
#
# These vhosts bind to the tunnel address only. The *:80 / *:443 sites keep
# serving direct (campus) connections to the gateway's own address.

<VirtualHost 100.64.77.1:80>
    ServerName glasslab.org
    ServerAlias www.glasslab.org
    RemoteIPProxyProtocol On
    RedirectMatch 302 ^/exam(/.*)?$ https://exam.glasslab.org/exam$1
    RedirectMatch 302 ^/(.*)$ https://glasslab.org/$1
    ErrorLog ${APACHE_LOG_DIR}/edge-error.log
    CustomLog ${APACHE_LOG_DIR}/edge-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost 100.64.77.1:443>
    ServerName glasslab.org
    ServerAlias www.glasslab.org
    RemoteIPProxyProtocol On
    DocumentRoot /var/www/html

    # Exam hub: redirect only, never proxied from here.
    ProxyPass /exam !
    RedirectMatch 302 ^/exam(/.*)?$ https://exam.glasslab.org/exam$1

    # DSEI 10200 offline reference, CCNY only. Through the relay every client
    # has a public address, so only CCNY's public range applies here.
    ProxyPass /dsei102 !
    RedirectMatch 301 ^/dsei102$ /dsei102/
    Alias /dsei102/ /var/www/dsei102/
    <Directory /var/www/dsei102>
        Options None
        AllowOverride None
        Require ip 134.74.0.0/16
    </Directory>
    #ROBOJAN_INCLUDE#

    ErrorLog ${APACHE_LOG_DIR}/edge-error.log
    CustomLog ${APACHE_LOG_DIR}/edge-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/glasslab.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/glasslab.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
