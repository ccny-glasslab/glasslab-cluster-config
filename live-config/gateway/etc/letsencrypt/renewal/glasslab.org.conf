# renew_before_expiry = 30 days
version = 1.21.0
archive_dir = /etc/letsencrypt/archive/glasslab.org
cert = /etc/letsencrypt/live/glasslab.org/cert.pem
privkey = /etc/letsencrypt/live/glasslab.org/privkey.pem
chain = /etc/letsencrypt/live/glasslab.org/chain.pem
fullchain = /etc/letsencrypt/live/glasslab.org/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = b081b0657dae2593ff04a606e7efb9f3
pref_challs = dns-01,
renew_hook = systemctl reload apache2
authenticator = manual
manual_auth_hook = /etc/letsencrypt/acme-dns-auth.py
server = https://acme-v02.api.letsencrypt.org/directory
