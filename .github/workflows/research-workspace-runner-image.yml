name: Release Research Workspace Runner

on:
  push:
    branches: [main]
    paths:
      - "services/research-workspace-runner/**"
      - "services/workflow-registry/definitions/research-workspace-cpu-v1.json"
      - "services/workflow-registry/definitions/benchmark-workspace-cpu-v1.json"
      - "services/workflow-registry/definitions/benchmark-workspace-gpu-v1.json"
      - ".github/workflows/research-workspace-runner-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-research-workspace-runner
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: research-cpu
            definition: research-workspace-cpu-v1.json
            dockerfile: services/research-workspace-runner/Dockerfile
          - name: benchmark-cpu
            definition: benchmark-workspace-cpu-v1.json
            dockerfile: services/research-workspace-runner/Dockerfile
          - name: benchmark-gpu
            definition: benchmark-workspace-gpu-v1.json
            dockerfile: services/research-workspace-runner/Dockerfile.gpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve registry-pinned image
        id: image
        shell: bash
        run: |
          python3 scripts/resolve_runner_image.py \
            --definition "services/workflow-registry/definitions/${{ matrix.definition }}" \
            --owner "${{ github.repository_owner }}" \
            --image glasslab-research-workspace-runner \
            --sha "${{ github.sha }}" \
            --matrix-name "${{ matrix.name }}" \
            >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # The digest embedded in the workflow definitions is authoritative
          # and cannot be re-pushed; publish only the immutable commit-derived
          # publication alias (see scripts/resolve_runner_image.py).
          tags: |
            ${{ steps.image.outputs.sha_ref }}
          build-args: |
            GLASSLAB_GIT_SHA=${{ github.sha }}
            GLASSLAB_BUILD_SOURCE=github:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record published image
        run: |
          {
            echo "### Research workspace runner: ${{ matrix.name }}"
            echo
            echo "- Authoritative digest: \`${{ steps.image.outputs.digest }}\`"
            echo "- Published tag: \`${{ steps.image.outputs.sha_ref }}\`"
            echo "- Built digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Source: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
