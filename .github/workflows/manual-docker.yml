name: Manual Docker Build

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service image to build"
        required: true
        default: "workflow-api"
        type: choice
        options:
          - workflow-api
          - research-command-router
          - schedule-worker
          - research-orchestrator
          - research-workspace-runner
          - runner
      push:
        description: "Push image to GHCR"
        required: true
        default: false
        type: boolean
      tag:
        description: "Image tag override"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: manual-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve build settings
        id: meta
        run: |
          # Convert repository owner to lowercase for GHCR
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          case "${{ inputs.service }}" in
            workflow-api)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=services/workflow-api/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "image=ghcr.io/${REPO_OWNER}/glasslab-workflow-api" >> "$GITHUB_OUTPUT"
              ;;
            research-command-router)
              echo "context=services/research-command-router" >> "$GITHUB_OUTPUT"
              echo "dockerfile=services/research-command-router/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "image=ghcr.io/${REPO_OWNER}/glasslab-research-command-router" >> "$GITHUB_OUTPUT"
              ;;
            schedule-worker)
              echo "context=services/schedule-worker" >> "$GITHUB_OUTPUT"
              echo "dockerfile=services/schedule-worker/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "image=ghcr.io/${REPO_OWNER}/glasslab-schedule-worker" >> "$GITHUB_OUTPUT"
              ;;
            research-orchestrator)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=services/research-orchestrator/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "image=ghcr.io/${REPO_OWNER}/glasslab-research-orchestrator" >> "$GITHUB_OUTPUT"
              ;;
            research-workspace-runner)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=services/research-workspace-runner/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "image=ghcr.io/${REPO_OWNER}/glasslab-research-workspace-runner" >> "$GITHUB_OUTPUT"
              ;;
            runner)
              echo "context=services/runner" >> "$GITHUB_OUTPUT"
              echo "dockerfile=services/runner/Dockerfile.gpu" >> "$GITHUB_OUTPUT"
              echo "image=ghcr.io/${REPO_OWNER}/glasslab-gpu-experiment-runner" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported service: ${{ inputs.service }}" >&2
              exit 1
              ;;
          esac

          if [ -n "${{ inputs.tag }}" ]; then
            TAG=$(echo "${{ inputs.tag }}" | tr '[:upper:]' '[:lower:]')
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            GLASSLAB_GIT_SHA=${{ github.sha }}
            GLASSLAB_BUILD_SOURCE=github:${{ github.run_id }}
