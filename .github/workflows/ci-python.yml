name: CI Python

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "services/**/*.py"
      - "services/**/requirements*.txt"
      - ".github/workflows/ci-python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: |
          python <<'PY'
          from pathlib import Path

          failures = []
          for path in Path("services").rglob("*.py"):
            try:
              compile(path.read_text(), str(path), "exec")
            except Exception as exc:
              failures.append((str(path), str(exc)))

          if failures:
            for path, exc in failures:
              print(f"{path}: {exc}")
            raise SystemExit(1)

          print("All Python files compiled successfully.")
          PY

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workflow-api-core
            workdir: services/workflow-api
            requirements: services/workflow-api/requirements.txt
            pythonpath: ../..:.
            tests: tests/test_api.py tests/test_persistence.py tests/test_run_artifacts.py tests/test_schedule_execution.py tests/test_validation.py
          - name: research-workspace-runner
            workdir: services/research-workspace-runner
            requirements: services/research-workspace-runner/requirements.txt
            pythonpath: .
            tests: tests/test_runner.py
          - name: research-orchestrator
            workdir: services/research-orchestrator
            requirements: services/research-orchestrator/requirements.txt
            pythonpath: .
            tests: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "${{ matrix.requirements }}" pytest httpx

      - name: Run ${{ matrix.name }} tests
        working-directory: ${{ matrix.workdir }}
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
        run: |
          pytest ${{ matrix.tests }} -q

  task-fabric:
    name: task-fabric protocol
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shared package from checked-out source
        run: |
          python -m pip install --upgrade pip
          pip install pytest ./services/task-fabric

      - name: Import installed package outside its source tree
        run: |
          cd services/research-workspace-runner
          python -c "import task_fabric; assert task_fabric.__all__"

      - name: Run task-fabric protocol tests
        working-directory: services/task-fabric
        env:
          PYTHONPATH: .
        run: pytest -q tests

  task-fabric-broker-runtime:
    name: task-fabric broker runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run broker runtime tests against pinned image
        run: pytest -q tests/integration

  postgres-store-contract:
    name: research-orchestrator PostgreSQL store contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glasslab
          POSTGRES_PASSWORD: glasslab
          POSTGRES_DB: orchestrator_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glasslab -d orchestrator_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research-orchestrator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/research-orchestrator/requirements-dev.txt

      - name: Run backend-neutral store contract
        working-directory: services/research-orchestrator
        env:
          PYTHONPATH: .
          GLASSLAB_TEST_POSTGRES_DSN: postgresql://glasslab:glasslab@127.0.0.1:5432/orchestrator_contract
        run: pytest tests/test_store_contract.py -q

      - name: Check ResearchStore structural conformance
        working-directory: services/research-orchestrator
        run: mypy --config-file mypy-research-store.ini

  research-orchestrator-clean-install:
    name: research-orchestrator clean install (image parity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and start from the documented production requirements only
        run: services/research-orchestrator/scripts/check-clean-install.sh

  research-orchestrator-dense-pgvector:
    name: research-orchestrator dense retrieval (pgvector present)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: glasslab
          POSTGRES_PASSWORD: glasslab
          POSTGRES_DB: orchestrator_dense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glasslab -d orchestrator_dense"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research-orchestrator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/research-orchestrator/requirements.txt pytest httpx

      # The DSN-gated dense suites skip without CORPUS_RAG_PG_DSN; this lane
      # is the required environment where pgvector actually exists, so those
      # tests must run (and pass) here. The store contract additionally runs
      # against this pgvector-enabled server to prove ordinary operations are
      # unaffected when the extension IS available.
      - name: Run dense/pgvector suites and store contract against pgvector
        working-directory: services/research-orchestrator
        env:
          PYTHONPATH: .
          CORPUS_RAG_PG_DSN: postgresql://glasslab:glasslab@127.0.0.1:5432/orchestrator_dense
          GLASSLAB_TEST_POSTGRES_DSN: postgresql://glasslab:glasslab@127.0.0.1:5432/orchestrator_dense
        run: pytest tests/test_knowledge_dense.py tests/test_corpus_rag_vector_index.py tests/test_corpus_rag_storage.py tests/test_store_contract.py -q

  adapter-tests:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: research-ingress
            workdir: services/research-ingress
            requirements: services/research-ingress/requirements.txt
            pythonpath: .
            tests: tests/test_api.py
          - name: research-command-router
            workdir: services/research-command-router
            requirements: services/research-command-router/requirements.txt
            pythonpath: .
            tests: tests/test_api.py
          - name: evaluator
            workdir: services/evaluator
            requirements: services/evaluator/requirements.txt
            pythonpath: .
            tests: tests/test_main.py
          - name: reporter
            workdir: services/reporter
            requirements: services/reporter/requirements.txt
            pythonpath: .
            tests: tests/test_main.py
          - name: contrastive-learning-runner
            workdir: services/runner
            requirements: services/runner/requirements.txt
            pythonpath: ../..:.
            tests: tests/test_contrastive_runner.py

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "${{ matrix.requirements }}" pytest httpx

      - name: Run ${{ matrix.name }} tests
        working-directory: ${{ matrix.workdir }}
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
        run: |
          pytest ${{ matrix.tests }} -q
