name: Dependency Audit

# Daily check of pinned dependencies against published advisories (OSV/GHSA).
# Dependabot opens the update PRs; this job lists anything already pinned that
# is known-vulnerable in the run summary and as warning annotations.
#
# Report-only by default: known findings (e.g. pypdf 5.x, starlette 0.46.x)
# need deliberate major-version bumps, and a red run on every PR and every
# morning only produced failure emails. Run it manually with strict=true to
# get a failing exit status once the backlog is cleared.
on:
  schedule:
    - cron: "17 9 * * *"
  pull_request:
    branches: [main, testing]
    paths:
      - "services/**/requirements*.txt"
      - "services/research-orchestrator/agent-tools/**"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail the run when any advisory is found"
        type: boolean
        default: false

permissions:
  contents: read

env:
  STRICT: ${{ inputs.strict && '1' || '0' }}

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Audit agent CLI lockfile
        working-directory: services/research-orchestrator/agent-tools
        run: |
          if npm audit --omit=dev --audit-level=moderate > audit.txt; then
            echo "No npm advisories at moderate or above." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat audit.txt
          {
            echo "### npm audit (agent-tools)"
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=npm audit::agent-tools lockfile has known advisories; see the run summary"
          [ "${STRICT}" = "1" ] && exit 1
          exit 0

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit service requirements
        run: |
          status=0
          echo "### pip-audit" >> "$GITHUB_STEP_SUMMARY"
          for req in services/*/requirements*.txt; do
            echo "::group::${req}"
            if pip-audit --progress-spinner off -r "${req}" > audit.txt; then
              cat audit.txt
            else
              status=1
              cat audit.txt
              if grep -q "known vulnerabilit" audit.txt; then
                echo "::warning title=pip-audit::${req} has known advisories; see the run summary"
              else
                echo "::warning title=pip-audit::${req} could not be audited; see the job log"
              fi
              {
                echo "#### ${req}"
                echo '```'
                cat audit.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          [ "${status}" = "0" ] && echo "No Python advisories found." >> "$GITHUB_STEP_SUMMARY"
          [ "${STRICT}" = "1" ] && exit "${status}"
          exit 0
