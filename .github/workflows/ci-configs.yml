name: CI Configs

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "kubeadm/**/*.yml"
      - "kubeadm/**/*.yaml"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "scripts/validate-configs.py"
      - "scripts/check-credential-hygiene.py"
      - "scripts/resolve_runner_image.py"
      - "tests/security/**"
      - "tests/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-configs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Install parser dependency
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML "ansible-core==2.16.19"

      - name: Validate YAML and JSON syntax
        run: python scripts/validate-configs.py

      - name: Run credential hygiene fixture tests
        run: python -m unittest tests.security.test_credential_hygiene -v

      - name: Run secret process and recovery boundary tests
        run: >-
          python -m unittest
          tests.security.test_secret_process_boundaries
          tests.security.test_secret_backup_restore
          tests.security.test_workflow_security_manifests
          tests.security.test_orchestrator_network_policy
          tests.security.test_orchestrator_infra_hardening
          tests.scripts.test_secret_permissions_preflight
          tests.scripts.test_checkout_permissions_preflight
          tests.scripts.test_rollout_image_preflight
          tests.scripts.test_rollout_sync_reexec
          tests.scripts.test_deploy_image_override
          tests.scripts.test_glasslab_allow_ssh
          tests.security.test_orchestrator_secret_isolation
          services/research-orchestrator/tests/scripts/test_orchestrator_ui_proxy.py
          -v

      - name: Run runner image resolution regression tests
        run: python -m unittest tests.scripts.test_resolve_runner_image -v

      - name: Run model-serve HF cache regression tests
        run: python -m unittest tests.scripts.test_model_serve_hf_home -v

      - name: Scan repository credential hygiene
        run: python scripts/check-credential-hygiene.py .

      - name: Validate Ansible inventory and playbooks
        working-directory: ansible
        run: |
          ansible-inventory -i inventory/hosts.yml --graph
          ansible-playbook -i inventory/hosts.yml \
            playbooks/manage-lab-identities.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/maintain-darwin-agent-tools.yml --syntax-check
