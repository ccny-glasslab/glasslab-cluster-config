name: Publish Service Images

on:
  push:
    branches: [main]
    paths:
      - "services/common/**"
      - "services/task-fabric/**"
      - "services/workflow-api/**"
      - "services/workflow-registry/**"
      - "services/research-orchestrator/**"
      - "services/assessment-agent/**"
      - "services/design-agent/**"
      - "services/intake-agent/**"
      - "services/interpretation-agent/**"
      - "services/schedule-worker/**"
      - ".github/workflows/service-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: service-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci-python.yml

  workflow-api:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: services/workflow-api/Dockerfile
          push: true
          tags: ghcr.io/ccny-glasslab/glasslab-workflow-api:${{ github.sha }}
          build-args: |
            GLASSLAB_GIT_SHA=${{ github.sha }}
            GLASSLAB_BUILD_SOURCE=github:${{ github.run_id }}
          cache-from: type=gha,scope=workflow-api
          cache-to: type=gha,mode=max,scope=workflow-api

  research-orchestrator:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: services/research-orchestrator/Dockerfile
          push: true
          tags: ghcr.io/ccny-glasslab/glasslab-research-orchestrator:${{ github.sha }}
          build-args: |
            GLASSLAB_GIT_SHA=${{ github.sha }}
            GLASSLAB_BUILD_SOURCE=github:${{ github.run_id }}
          cache-from: type=gha,scope=research-orchestrator
          cache-to: type=gha,mode=max,scope=research-orchestrator

  research-orchestrator-gpu:
    # Built FROM the CPU image of the same commit, so it must wait for that
    # image to be published first.
    needs: research-orchestrator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: services/research-orchestrator/Dockerfile.gpu
          push: true
          tags: ghcr.io/ccny-glasslab/glasslab-research-orchestrator-gpu:${{ github.sha }}
          build-args: |
            CPU_IMAGE=ghcr.io/ccny-glasslab/glasslab-research-orchestrator:${{ github.sha }}
            GLASSLAB_GIT_SHA=${{ github.sha }}
            GLASSLAB_BUILD_SOURCE=github:${{ github.run_id }}
          cache-from: type=gha,scope=research-orchestrator-gpu
          cache-to: type=gha,mode=max,scope=research-orchestrator-gpu

  assessment-agent:
