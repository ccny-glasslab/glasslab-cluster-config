---
- name: Prepare provisioner as cluster admin workstation
  hosts: provisioner
  gather_facts: true
  become: true
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Install kubectl repository prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
          - gnupg
        state: present
        update_cache: true

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Create temporary file for Kubernetes release key
      ansible.builtin.tempfile:
        state: file
        suffix: .key
      register: k8s_key_tempfile

    - name: Download Kubernetes repository release key
      ansible.builtin.get_url:
        url: "{{ kubernetes_repo_key_url }}"
        dest: "{{ k8s_key_tempfile.path }}"
        mode: '0600'
        checksum: "{{ kubernetes_repo_key_checksum | default(omit) }}"

    - name: Install Kubernetes repository keyring
      ansible.builtin.command:
        cmd: >-
          gpg --dearmor --batch --yes
          -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          {{ k8s_key_tempfile.path }}
      changed_when: true

    - name: Remove temporary Kubernetes release key
      ansible.builtin.file:
        path: "{{ k8s_key_tempfile.path }}"
        state: absent

    - name: Configure Kubernetes apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        mode: '0644'
        backup: true
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] {{ kubernetes_repo_base }} /

    - name: Install kubectl on the provisioner host
      ansible.builtin.apt:
        name: kubectl
        state: present
        update_cache: true

    - name: Ensure kubectl package stays pinned to the selected repo stream
      ansible.builtin.dpkg_selections:
        name: kubectl
        selection: hold

    - name: Ensure kube config directory exists for future admin.conf
      ansible.builtin.file:
        path: /home/glasslab/.kube
        state: directory
        owner: glasslab
        group: glasslab
        mode: '0700'
