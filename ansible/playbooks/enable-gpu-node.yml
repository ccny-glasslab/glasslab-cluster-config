---
- name: Enable NVIDIA GPU runtime on selected nodes
  hosts: "{{ gpu_target_group | default('gpu_nodes') }}"
  gather_facts: true
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/gpu_nodes.yml
  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        enabled: true

  tasks:
    - name: Confirm NVIDIA PCI devices are visible before enablement
      ansible.builtin.command:
        cmd: "lspci -Dnnd 10de:"
      register: gpu_nvidia_lspci
      changed_when: false
      failed_when: gpu_nvidia_lspci.stdout | trim == ''

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Install kernel headers for the running kernel
      ansible.builtin.apt:
        name: "linux-headers-{{ ansible_kernel }}"
        state: present
        update_cache: true

    - name: Install pinned NVIDIA driver package
      ansible.builtin.apt:
        name: "{{ gpu_driver_package_override | default(gpu_driver_package) }}"
        state: present
      register: gpu_driver_install
      when: gpu_driver_install_enabled | bool

    - name: Install NVIDIA container toolkit keyring
      ansible.builtin.get_url:
        url: "{{ gpu_nvidia_container_repo_key_url }}"
        dest: "/tmp/glasslab-nvidia-container-key.asc"
        checksum: "{{ gpu_nvidia_container_repo_key_checksum }}"
        mode: '0644'
      when: gpu_nvidia_container_toolkit_enabled | bool

    - name: Dearmor the verified NVIDIA container toolkit keyring
      ansible.builtin.shell: |
        set -euo pipefail
        gpg --dearmor --batch --yes -o "{{ gpu_nvidia_container_keyring }}" /tmp/glasslab-nvidia-container-key.asc
        rm -f /tmp/glasslab-nvidia-container-key.asc
      args:
        executable: /bin/bash
      when: gpu_nvidia_container_toolkit_enabled | bool

    - name: Configure NVIDIA container toolkit apt repository
      ansible.builtin.copy:
        dest: "{{ gpu_nvidia_container_repo_list }}"
        mode: '0644'
        backup: true
        content: |
          deb [signed-by={{ gpu_nvidia_container_keyring }}] {{ gpu_nvidia_container_repo_base }} /
      when: gpu_nvidia_container_toolkit_enabled | bool

    - name: Install NVIDIA container toolkit package
      ansible.builtin.apt:
        name: "{{ gpu_nvidia_container_toolkit_package }}"
        state: present
        update_cache: true
      when: gpu_nvidia_container_toolkit_enabled | bool

    - name: Check if NVIDIA runtime is already configured in containerd
      ansible.builtin.command:
        cmd: grep -q 'nvidia' /etc/containerd/config.toml
      register: gpu_containerd_nvidia_check
      changed_when: false
      failed_when: false
      when: gpu_nvidia_container_toolkit_enabled | bool

    - name: Configure NVIDIA runtime for containerd
      ansible.builtin.command:
        cmd: nvidia-ctk runtime configure --runtime=containerd --config=/etc/containerd/config.toml
      register: gpu_containerd_configure
      changed_when: true
      when:
        - gpu_nvidia_container_toolkit_enabled | bool
        - gpu_containerd_nvidia_check.rc is defined
        - gpu_containerd_nvidia_check.rc != 0
      notify:
        - Restart containerd
        - Restart kubelet

    - name: Reboot after NVIDIA driver or runtime configuration changes
      ansible.builtin.reboot:
        reboot_timeout: "{{ gpu_reboot_timeout }}"
        post_reboot_delay: 20
        test_command: nvidia-smi -L
      when: >-
        (gpu_driver_install is defined and gpu_driver_install.changed) or
        (gpu_containerd_configure is defined and gpu_containerd_configure.changed)

    - name: Verify NVIDIA driver is functional after reboot
      ansible.builtin.command: nvidia-smi -L
      register: gpu_nvidia_smi
      changed_when: false

    - name: Show final GPU inventory
      ansible.builtin.debug:
        var: gpu_nvidia_smi.stdout_lines
