<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glasslab PDF highlight</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self';"
    />
    <link rel="stylesheet" href="theme.css" />
    <script src="../build/pdf.mjs" type="module"></script>
    <script src="highlight.mjs" type="module"></script>
  </head>
  <body>
    <main id="viewer">
      <header class="toolbar">
        <span class="brand">Glasslab PDF</span>
        <span id="meta" class="meta" title="source and page"></span>
      </header>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="stage" class="stage">
        <div id="page" class="page"></div>
      </div>
    </main>
  </body>
</html>
