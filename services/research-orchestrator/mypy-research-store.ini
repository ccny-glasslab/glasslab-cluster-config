# Deliberately scoped to the ResearchStore structural-conformance assertion.
# This is not a general static-type gate for the orchestrator codebase.
[mypy]
python_version = 3.11
mypy_path = .
files = tests/test_research_store_protocol.py
ignore_missing_imports = True
check_untyped_defs = True

# The protocol under test is imported through app.corpus_rag, whose chat
# service lazily imports app.citation_locator and therefore app.knowledge_manager.
# That module carries pre-existing, unrelated type errors (verified present on
# main before this feature) which are outside this deliberately narrow
# conformance check. Silence that one module only; the store modules under test
# are still fully checked.
[mypy-app.knowledge_manager]
follow_imports = silent

