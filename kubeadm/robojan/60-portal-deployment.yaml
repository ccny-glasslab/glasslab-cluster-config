apiVersion: v1
kind: ConfigMap
metadata:
  name: robojan-portal-config
  namespace: robojan
  labels:
    app.kubernetes.io/name: robojan-portal
    app.kubernetes.io/part-of: robojan
data:
  # Emails are exact addresses; domains admit every verified Google account in
  # the domain. The shipped policy is the CCNY domain; add exact addresses or
  # narrow the domain when the portal is limited to specific people.
  PORTAL_ALLOWED_EMAILS: "tyler.laboekleint40@login.cuny.edu,tyleralk@gmail.com"
  PORTAL_ALLOWED_DOMAINS: "ccny.cuny.edu"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robojan-portal
  namespace: robojan
  labels:
    app.kubernetes.io/name: robojan-portal
    app.kubernetes.io/part-of: robojan
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: robojan-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robojan-portal
        app.kubernetes.io/part-of: robojan
    spec:
      # The portal never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: glasslab-ghcr-pull
      containers:
        - name: portal
          # Built by ccny-glasslab/robojan CI on push to main; the tag is that
          # main commit's full SHA. Bump it in a committed change.
          image: ghcr.io/ccny-glasslab/robojan-portal:d7a92cd6671f3ce02afb5a66b8206a64b7fe8549
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: robojan-portal-config
          env:
            # Apache serves the portal at https://glasslab.org/robojan/ and
            # strips that prefix before the request reaches this Service.
            # root_path makes the app's redirects and links prefix-aware.
            - name: PORTAL_PUBLIC_URL
              value: https://glasslab.org/robojan
            - name: PORTAL_ROOT_PATH
              value: /robojan
            - name: PORTAL_BOB_URL
              value: http://robojan-bob.robojan.svc.cluster.local:8080
            - name: PORTAL_COOKIE_SECURE
              value: "true"
            - name: PORTAL_BOB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: robojan-portal
                  key: PORTAL_BOB_TOKEN
            - name: PORTAL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: robojan-portal
                  key: PORTAL_SECRET_KEY
            # Optional until the Google client is created. The portal starts
            # and says sign-in is not configured instead of failing to boot.
            - name: PORTAL_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: robojan-portal
                  key: PORTAL_GOOGLE_CLIENT_ID
                  optional: true
            - name: PORTAL_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: robojan-portal
                  key: PORTAL_GOOGLE_CLIENT_SECRET
                  optional: true
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: robojan-portal
  namespace: robojan
  labels:
    app.kubernetes.io/name: robojan-portal
    app.kubernetes.io/part-of: robojan
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: robojan-portal
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30090
