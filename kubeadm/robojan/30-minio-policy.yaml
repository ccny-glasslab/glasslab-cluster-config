apiVersion: v1
kind: ConfigMap
metadata:
  name: robojan-bob-minio-policy
  namespace: glasslab-v2
data:
  # Bob's object-store identity: list, read, and create objects in
  # robojan-originals only. No DeleteObject, so originals cannot be removed or
  # replaced through Bob's credential (report §8: originals are immutable; Bob
  # also refuses to overwrite an existing key). Never widen it to "*".
  robojan-bob-originals.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
          "Resource": ["arn:aws:s3:::robojan-originals"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject"],
          "Resource": ["arn:aws:s3:::robojan-originals/*"]
        }
      ]
    }
