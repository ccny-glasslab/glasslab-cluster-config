apiVersion: apps/v1
kind: Deployment
metadata:
  name: robojan-bob
  namespace: robojan
  labels:
    app.kubernetes.io/name: robojan-bob
    app.kubernetes.io/part-of: robojan
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: robojan-bob
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robojan-bob
        app.kubernetes.io/part-of: robojan
    spec:
      nodeSelector:
        kubernetes.io/hostname: node05
      # Bob never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: glasslab-ghcr-pull
      containers:
        - name: bob
          # Built by ccny-glasslab/robojan CI on push to main; the tag is that
          # main commit's full SHA. Bump it in a committed change to upgrade.
          image: ghcr.io/ccny-glasslab/robojan-bob:61bf4d94ccc1a2edaf028c4222363b855e5c232b
          imagePullPolicy: IfNotPresent
          env:
            - name: BOB_STORE
              value: s3
            - name: BOB_S3_ENDPOINT
              value: glasslab-minio.glasslab-v2.svc.cluster.local:9000
            - name: BOB_S3_BUCKET
              value: robojan-originals
            - name: BOB_S3_SECURE
              value: "false"
            - name: BOB_EMBEDDINGS_URL
              value: http://192.168.1.17:11434/v1
            - name: BOB_EMBEDDINGS_MODEL
              value: qwen3-embedding:8b
            - name: BOB_EMBEDDINGS_DIMENSIONS
              value: "4096"
            - name: BOB_RERANK_URL
              value: http://192.168.1.17:11435
            - name: BOB_RERANK_MODEL
              value: bge-reranker-v2-m3
            - name: BOB_RERANK_CANDIDATES
              value: "50"
            # Exact cosine scan over the vector table; 5 s default timed out
            # while a corpus load shared the pod's single CPU.
            - name: BOB_SEARCH_TIMEOUT_MS
              value: "15000"
            - name: BOB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: robojan-bob
                  key: BOB_DATABASE_URL
            - name: BOB_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: robojan-bob
                  key: BOB_S3_ACCESS_KEY
            - name: BOB_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: robojan-bob
                  key: BOB_S3_SECRET_KEY
            - name: BOB_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: robojan-bob
                  key: BOB_API_TOKENS
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Multipart uploads spool here before Bob hashes and stores them.
            - name: tmp
              mountPath: /tmp
          # 3 GiB: PDF extraction holds the whole file and its text in memory;
          # a 120 MB scanned PDF OOMKilled the 1 GiB limit on 2026-11-12.
          # Two cores: pypdf over the 90-120 MB scanned PDFs in the first
          # corpus halved the load time when the limit went from 1 to 2.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          # The vector migration and HNSW build can take minutes; the probe
          # budget keeps liveness from killing the pod mid-migration.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: robojan-bob
  namespace: robojan
  labels:
    app.kubernetes.io/name: robojan-bob
spec:
  selector:
    app.kubernetes.io/name: robojan-bob
  ports:
    - name: http
      port: 8080
      targetPort: http
