apiVersion: batch/v1
kind: Job
metadata:
  name: robojan-bob-provision-minio
  namespace: glasslab-v2
  labels:
    app.kubernetes.io/name: robojan-bob-minio-provisioner
    app.kubernetes.io/component: minio
spec:
  # One-shot, idempotent IAM convergence, modelled on
  # glasslab-v2/minio/45-provision-scoped-users-job.yaml. Creates the
  # robojan-originals bucket with versioning, the bucket-scoped policy, and
  # Bob's scoped user. Re-run (delete + apply) to rotate the user's secret.
  #
  # Blocked: quay.io/minio/mc no longer serves anonymous pulls and no other
  # registry publishes the image (#768). Until it is repinned or mirrored, this
  # Job stays ImagePullBackOff; kubeadm/robojan/README.md documents the
  # pod-exec provisioning path used for the first rollout.
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robojan-bob-minio-provisioner
        app.kubernetes.io/component: minio
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          # minio/mc, digest-pinned (RELEASE.2025-08-13T08-35-41Z), same as glasslab-v2.
          image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              endpoint="glasslab-minio.glasslab-v2.svc.cluster.local:9000"
              export MC_HOST_root="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@${endpoint}"
              attempt=0
              until mc admin info root >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then
                  echo "MinIO did not accept root credentials within the timeout" >&2
                  exit 1
                fi
                sleep 5
              done
              mc mb --ignore-existing "root/${BUCKET}"
              mc version enable "root/${BUCKET}"
              mc admin policy create root "$MINIO_POLICY_NAME" "/policies/${MINIO_POLICY_NAME}.json"
              printf '%s\n%s\n' "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" | mc admin user add root
              if ! mc admin user info root "$MINIO_ACCESS_KEY" | grep -q "$MINIO_POLICY_NAME"; then
                mc admin policy attach root "$MINIO_POLICY_NAME" --user "$MINIO_ACCESS_KEY"
              fi
              echo "provisioned ${MINIO_ACCESS_KEY} with policy ${MINIO_POLICY_NAME} on ${BUCKET}"
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: glasslab-v2-minio
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glasslab-v2-minio
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: robojan-bob-minio
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: robojan-bob-minio
                  key: MINIO_SECRET_KEY
            - name: BUCKET
              value: robojan-originals
            - name: MINIO_POLICY_NAME
              value: robojan-bob-originals
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policies
          configMap:
            name: robojan-bob-minio-policy
        - name: tmp
          emptyDir: {}
