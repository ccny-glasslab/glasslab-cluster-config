# Documentation-only schema. This file is intentionally not a deployable
# Kubernetes Secret. Create the real Secrets through the SOPS operator boundary
# (docs/glasslab-v2/runbooks/restore-v2-secrets.md); never commit values.
#
# Bob's own Secret, read only by the Bob Deployment in namespace robojan.
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: robojan-bob
    namespace: robojan
  required_keys:
    # postgresql://robojan_bob:<password>@glasslab-postgres.glasslab-v2.svc.cluster.local:5432/robojan_bob
    - BOB_DATABASE_URL
    # Same values as MINIO_ACCESS_KEY / MINIO_SECRET_KEY in robojan-bob-minio.
    - BOB_S3_ACCESS_KEY
    - BOB_S3_SECRET_KEY
    # Comma-separated token=subject pairs, one per person or service.
    - BOB_API_TOKENS
  example_values_are_not_deployable: true
---
# Read only by the one-shot database provisioning Job in glasslab-v2. The
# password must match the one inside BOB_DATABASE_URL above.
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: robojan-bob-postgres
    namespace: glasslab-v2
  required_keys:
    - BOB_DB_PASSWORD
  example_values_are_not_deployable: true
---
# Read only by the one-shot MinIO provisioning Job in glasslab-v2.
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: robojan-bob-minio
    namespace: glasslab-v2
  required_keys:
    - MINIO_ACCESS_KEY
    - MINIO_SECRET_KEY
  example_values_are_not_deployable: true
---
# Image pull credential. Secrets are namespace-scoped, so copy the existing
# glasslab-v2 pull secret into robojan (same type and .dockerconfigjson key).
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: glasslab-ghcr-pull
    namespace: robojan
  type: kubernetes.io/dockerconfigjson
  required_keys:
    - .dockerconfigjson
  example_values_are_not_deployable: true
