# Documentation-only schema. This file is intentionally not a deployable
# Kubernetes Secret. Create the real Secrets through the SOPS operator boundary
# (docs/glasslab-v2/runbooks/restore-v2-secrets.md); never commit values.
#
# Bob's own Secret, read only by the Bob Deployment in namespace robojan.
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: robojan-bob
    namespace: robojan
  required_keys:
    # postgresql://robojan_bob:<password>@glasslab-postgres.glasslab-v2.svc.cluster.local:5432/robojan_bob
    - BOB_DATABASE_URL
    # Same values as MINIO_ACCESS_KEY / MINIO_SECRET_KEY in robojan-bob-minio.
    - BOB_S3_ACCESS_KEY
    - BOB_S3_SECRET_KEY
    # Comma-separated token=subject pairs, one per person or service. The
    # portal's token in the robojan-portal Secret must appear here with the
    # subject "portal"; add it to Bob before rolling the portal out.
    - BOB_API_TOKENS
  example_values_are_not_deployable: true
---
# Read only by the portal Deployment. Generate PORTAL_SECRET_KEY with at least
# 32 random bytes; it signs the browser session cookie. PORTAL_BOB_TOKEN is the
# token half of the "token=portal" pair in Bob's BOB_API_TOKENS. The Google
# values are optional at boot: without them the portal serves a 503 that says
# sign-in is not configured.
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: robojan-portal
    namespace: robojan
  required_keys:
    - PORTAL_SECRET_KEY
    - PORTAL_BOB_TOKEN
  required_to_enable_sign_in:
    - PORTAL_GOOGLE_CLIENT_ID
    - PORTAL_GOOGLE_CLIENT_SECRET
  example_values_are_not_deployable: true
---
# Read only by the one-shot database provisioning Job in glasslab-v2. The
# password must match the one inside BOB_DATABASE_URL above.
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: robojan-bob-postgres
    namespace: glasslab-v2
  required_keys:
    - BOB_DB_PASSWORD
  example_values_are_not_deployable: true
---
# Read only by the one-shot MinIO provisioning Job in glasslab-v2.
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: robojan-bob-minio
    namespace: glasslab-v2
  required_keys:
    - MINIO_ACCESS_KEY
    - MINIO_SECRET_KEY
  example_values_are_not_deployable: true
---
# Image pull credential. Secrets are namespace-scoped, so copy the existing
# glasslab-v2 pull secret into robojan (same type and .dockerconfigjson key).
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: glasslab-ghcr-pull
    namespace: robojan
  type: kubernetes.io/dockerconfigjson
  required_keys:
    - .dockerconfigjson
  example_values_are_not_deployable: true
