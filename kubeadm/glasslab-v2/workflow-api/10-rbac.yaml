apiVersion: v1
kind: ServiceAccount
metadata:
  name: glasslab-workflow-api
  namespace: glasslab-v2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: glasslab-workflow-api-job-submitter
  namespace: glasslab-v2
rules:
  # No list/watch on jobs: app/job_submission.py is the only Kubernetes job
  # client and uses create_namespaced_job, read_namespaced_job, and
  # delete_namespaced_job only; execution_preflight.py and run_artifacts.py
  # never touch the batch API. Re-add list/watch only together with a code
  # path that consumes them (issue #602).
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # execution_preflight reads the pull secret to confirm it exists before
  # submitting; scoped to that one secret so the service cannot read others.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["glasslab-ghcr-pull"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: glasslab-workflow-api-job-submitter
  namespace: glasslab-v2
subjects:
  - kind: ServiceAccount
    name: glasslab-workflow-api
    namespace: glasslab-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: glasslab-workflow-api-job-submitter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glasslab-workflow-api-preflight-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glasslab-workflow-api-preflight-reader
subjects:
  - kind: ServiceAccount
    name: glasslab-workflow-api
    namespace: glasslab-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glasslab-workflow-api-preflight-reader
