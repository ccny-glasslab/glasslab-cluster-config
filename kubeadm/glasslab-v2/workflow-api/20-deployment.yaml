apiVersion: apps/v1
kind: Deployment
metadata:
  name: glasslab-workflow-api
  namespace: glasslab-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glasslab-workflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glasslab-workflow-api
    spec:
      nodeSelector:
        kubernetes.io/hostname: node05
      serviceAccountName: glasslab-workflow-api
      # Kubernetes job submission calls load_incluster_config()
      # (app/job_submission.py), so the projected ServiceAccount token must be
      # mounted. automountServiceAccountToken: false removes that token and
      # breaks every job submission; this is pinned true explicitly so a
      # hardening sweep cannot silently disable it (issue #602).
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: glasslab-ghcr-pull
      containers:
        - name: workflow-api
          image: ghcr.io/ccny-glasslab/glasslab-workflow-api:d2033ff8b683edaa9b5c3125b50e3a98a402bacc
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: glasslab-v2-workflow-api-config
          env:
            - name: GLASSLAB_WORKFLOW_API_SCHEDULE_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: glasslab-workflow-api-schedule-worker
                  key: token
            - name: GLASSLAB_WORKFLOW_API_RESEARCH_ORCHESTRATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: glasslab-workflow-api-research-orchestrator
                  key: token
            - name: GLASSLAB_WORKFLOW_API_STORE_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: glasslab-v2-workflow-api
                  key: GLASSLAB_WORKFLOW_API_STORE_POSTGRES_DSN
                  optional: true
            - name: GLASSLAB_WORKFLOW_API_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: glasslab-v2-workflow-api-minio
                  key: MINIO_ACCESS_KEY
                  optional: true
            - name: GLASSLAB_WORKFLOW_API_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glasslab-v2-workflow-api-minio
                  key: MINIO_SECRET_KEY
                  optional: true
            - name: GLASSLAB_WORKFLOW_API_MINIO_ENDPOINT
              value: glasslab-minio.glasslab-v2.svc.cluster.local:9000
            - name: GLASSLAB_WORKFLOW_API_AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: glasslab-agent-internal-token
                  key: token
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifacts-volume
              mountPath: /mnt/artifacts
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: artifacts-volume
          persistentVolumeClaim:
            claimName: glasslab-shared-artifacts
        - name: tmp
          emptyDir: {}
