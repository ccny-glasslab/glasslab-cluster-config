# Schedule-worker trigger (issue #602).
#
# The worker Deployment is stateless: this CronJob is the only caller of
# POST /run-once, and it presents the shared internal token from the
# glasslab-agent-internal-token Secret. The endpoint fails closed (401/503)
# without that token, and the schedule-worker ingress NetworkPolicy admits
# only this CronJob's pod label.
#
# A failed /run-once (non-2xx) makes wget exit non-zero, which fails the Job
# so failedJobsHistoryLimit keeps the failure visible; the worker already
# returns 200 for partial rerun failures so completed digest work is not
# retried by the Job backoff.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: glasslab-schedule-worker-run-once
  namespace: glasslab-v2
spec:
  # Due digest schedules and approved reruns are resolved server-side, so a
  # short bounded poll interval is sufficient and overlapping runs are denied.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: glasslab-schedule-worker-cron
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: run-once
              image: busybox:1.36@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
              command:
                - /bin/sh
                - -c
                - >
                  wget -q -O /dev/null
                  --post-data=''
                  --header="X-Glasslab-Internal-Token: ${GLASSLAB_AGENT_INTERNAL_TOKEN}"
                  http://glasslab-schedule-worker.glasslab-v2.svc.cluster.local:8094/run-once
              env:
                - name: GLASSLAB_AGENT_INTERNAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: glasslab-agent-internal-token
                      key: token
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop: ["ALL"]
