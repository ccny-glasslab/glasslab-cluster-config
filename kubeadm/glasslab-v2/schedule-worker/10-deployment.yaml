apiVersion: apps/v1
kind: Deployment
metadata:
  name: glasslab-schedule-worker
  namespace: glasslab-v2
spec:
  # The schedule-worker CronJob (30-cronjob.yaml) POSTs to this Deployment's
  # Service, so it must have a running pod; replicas: 0 made /run-once
  # unreachable and every CronJob run failed.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glasslab-schedule-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glasslab-schedule-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: glasslab-ghcr-pull
      containers:
        - name: schedule-worker
          # Not published yet: service-images.yml builds on push to main and
          # tags with the commit SHA. This marker is allowlisted in
          # scripts/validate-configs.py, and the release path substitutes the
          # merged main SHA; never replace it with a guessed or all-zero SHA.
          image: ghcr.io/ccny-glasslab/glasslab-schedule-worker:pending-ci-build
          imagePullPolicy: IfNotPresent
          env:
            - name: GLASSLAB_WORKFLOW_API_CALLER_NAME
              value: schedule-worker
            - name: GLASSLAB_WORKFLOW_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: glasslab-workflow-api-schedule-worker
                  key: token
            - name: GLASSLAB_SCHEDULE_WORKER_WORKFLOW_API_URL
              value: http://glasslab-workflow-api.glasslab-v2.svc.cluster.local:8080
            - name: GLASSLAB_SCHEDULE_WORKER_TIMEOUT_SECONDS
              value: "30"
            - name: GLASSLAB_AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: glasslab-agent-internal-token
                  key: token
          ports:
            - containerPort: 8094
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
