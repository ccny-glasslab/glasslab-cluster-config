apiVersion: apps/v1
kind: Deployment
metadata:
  name: glasslab-research-command-router
  namespace: glasslab-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glasslab-research-command-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glasslab-research-command-router
    spec:
      nodeSelector:
        kubernetes.io/hostname: node05
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: glasslab-ghcr-pull
      containers:
        - name: research-command-router
          image: ghcr.io/ccny-glasslab/glasslab-research-command-router:0.1.11-local
          imagePullPolicy: IfNotPresent
          env:
            - name: GLASSLAB_WORKFLOW_API_CALLER_NAME
              value: research-command-router
            - name: GLASSLAB_WORKFLOW_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: glasslab-workflow-api-research-command-router
                  key: token
            - name: GLASSLAB_RESEARCH_COMMAND_ROUTER_WORKFLOW_API_URL
              value: http://glasslab-workflow-api.glasslab-v2.svc.cluster.local:8080
            - name: GLASSLAB_RESEARCH_COMMAND_ROUTER_TIMEOUT_SECONDS
              value: "120"
          ports:
            - containerPort: 8095
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
