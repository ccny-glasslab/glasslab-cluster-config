# Documentation-only schema. This file is intentionally not a deployable
# Kubernetes Secret.
#
# Control-plane secrets are projected into the orchestrator pod as read-only
# files under /etc/glasslab-secrets (see 20-deployment.yaml) and are read via
# GLASSLAB_ORCHESTRATOR_SECRETS_DIR, never injected as environment variables:
# the same-UID OpenCode child shares the orchestrator container and could read
# /proc/1/environ (issue #597). The volume projects only the keys below, so
# every one must exist in the Secret or the pod fails to mount.
#
# The hosted model provider authenticates from the separate
# `glasslab-opencode-auth` Secret mounted at /etc/opencode-auth (selected by
# GLASSLAB_ORCHESTRATOR_OPENCODE_AUTH_JSON_PATH); OPENCODE_API_KEY is no longer
# read from this Secret.
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: glasslab-research-orchestrator
    namespace: glasslab-v2
  delivery: read-only-file-volume
  mount_path: /etc/glasslab-secrets
  required_keys:
    - GLASSLAB_ORCHESTRATOR_STORE_POSTGRES_DSN
    - GLASSLAB_ORCHESTRATOR_OPERATOR_API_TOKEN
    - GLASSLAB_ORCHESTRATOR_DISCORD_BOT_TOKEN
    - GLASSLAB_ORCHESTRATOR_DISCORD_WEBHOOK_URL
    - GLASSLAB_ORCHESTRATOR_LINK_SIGNING_SECRET
  example_values_are_not_deployable: true
---
# The workflow-api caller token is isolated from the orchestrator's other
# credentials so it can be rotated and shared only with workflow-api. It stays
# an environment variable: it is not a control-plane secret that unlocks the
# orchestrator's own data, and workflow-api never runs inside this pod.
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: glasslab-workflow-api-research-orchestrator
    namespace: glasslab-v2
  required_keys:
    - token
  example_values_are_not_deployable: true
