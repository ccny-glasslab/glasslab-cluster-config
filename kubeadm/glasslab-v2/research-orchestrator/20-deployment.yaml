apiVersion: apps/v1
kind: Deployment
metadata:
  name: glasslab-research-orchestrator
  namespace: glasslab-v2
spec:
  replicas: 1
  # The orchestrator is a singleton over shared Postgres state and NFS
  # worktrees; a RollingUpdate surge would run two replicas that both drive
  # recover()/watcher against the same runs. Recreate guarantees the old pod
  # is gone before the new one starts (issue #240).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: glasslab-research-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glasslab-research-orchestrator
    spec:
      serviceAccountName: glasslab-research-orchestrator
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: node05
      imagePullSecrets:
        - name: glasslab-ghcr-pull
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: approved-repository
          image: alpine/git:2.47.2@sha256:0d9a3a551058dba37ea77757955d3e834442ccf8540783671cc25c0d97957894
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              target=/mnt/artifacts/research-orchestrator/approved-repo
              mkdir -p "$(dirname "$target")"
              if [ ! -d "$target/.git" ]; then
                git clone --branch main --single-branch \
                  https://github.com/ccny-glasslab/glasslab-cluster-config.git \
                  "$target"
              fi
              git -C "$target" fetch origin main
              git -C "$target" checkout --detach origin/main
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifacts-volume
              mountPath: /mnt/artifacts
      containers:
        - name: orchestrator
          image: ghcr.io/ccny-glasslab/glasslab-research-orchestrator:d2033ff8b683edaa9b5c3125b50e3a98a402bacc
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: glasslab-research-orchestrator-config
          env:
            # Control-plane secrets are projected as read-only files under
            # GLASSLAB_ORCHESTRATOR_SECRETS_DIR, not env: the same-UID
            # OpenCode child shares this container and could read
            # /proc/1/environ (issue #597).
            - name: GLASSLAB_ORCHESTRATOR_SECRETS_DIR
              value: /etc/glasslab-secrets
            - name: GLASSLAB_WORKFLOW_API_CALLER_NAME
              value: research-orchestrator
            - name: GLASSLAB_WORKFLOW_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: glasslab-workflow-api-research-orchestrator
                  key: token
            # The dense-retrieval embedding model downloads its weights to
            # HF_HOME at first use; the pod home is read-only, so point the
            # cache at the persistent shared volume next to opencode-cache.
            - name: HF_HOME
              value: /mnt/artifacts/research-orchestrator/hf-cache
            # The real-model rehearsal driver keeps its checkpoint and SQLite
            # store under REHEARSE_ROOT. Pin it to the shared artifacts PVC so
            # a Recreate rollout does not destroy an in-progress rehearsal
            # (issue #426).
            - name: REHEARSE_ROOT
              value: /mnt/artifacts/research-orchestrator/rehearsal
            # Pin torch/OpenMP/MKL to the 2-CPU container limit so a first-use
            # reranker/embedding model load does not spawn host-core threads
            # and thrash under the 2-CPU cgroup.
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
          ports:
            - containerPort: 8080
              name: http
          # A slow first start (e.g. a cold dense-index/model load) must never
          # trip the liveness probe; the startupProbe gates liveness for up to
          # ~150 s before the pod is considered unhealthy.
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifacts-volume
              mountPath: /mnt/artifacts
            - name: temporary
              mountPath: /tmp
            - name: opencode-auth
              mountPath: /etc/opencode-auth
              readOnly: true
            - name: control-plane-secrets
              mountPath: /etc/glasslab-secrets
              readOnly: true
        # The agent runtime runs as a different UID (10002) in this container,
        # which does NOT mount control-plane-secrets (issue #597). It shares
        # the pod network namespace, so the orchestrator reaches the loopback
        # broker and each opencode server on 127.0.0.1. It holds only the
        # shared artifacts volume and the model-provider auth it legitimately
        # needs; the same primary group (10001) keeps the shared NFS volume
        # writable without fsGroup support.
        - name: opencode
          image: ghcr.io/ccny-glasslab/glasslab-research-orchestrator:d2033ff8b683edaa9b5c3125b50e3a98a402bacc
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "app.opencode_sidecar"]
          env:
            - name: GLASSLAB_OPENCODE_SIDECAR_HOST
              value: 127.0.0.1
            - name: GLASSLAB_OPENCODE_SIDECAR_PORT
              value: "4200"
            - name: GLASSLAB_OPENCODE_SIDECAR_EXECUTABLE
              value: /usr/local/bin/opencode
            - name: GLASSLAB_OPENCODE_SIDECAR_WORKSPACE_ROOT
              value: /mnt/artifacts/research-orchestrator/runs
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifacts-volume
              mountPath: /mnt/artifacts
            - name: opencode-temporary
              mountPath: /tmp
            - name: opencode-auth
              mountPath: /etc/opencode-auth
              readOnly: true
      volumes:
        - name: artifacts-volume
          persistentVolumeClaim:
            claimName: glasslab-shared-artifacts
        - name: temporary
          emptyDir: {}
        - name: opencode-temporary
          emptyDir: {}
        - name: opencode-auth
          secret:
            secretName: glasslab-opencode-auth
            defaultMode: 0444
        # Control-plane secrets as read-only files, never env (issue #597).
        # Only the keys the service reads are projected; the live Secret must
        # contain every listed key (see 11-secret.example.yaml).
        - name: control-plane-secrets
          secret:
            secretName: glasslab-research-orchestrator
            defaultMode: 0400
            items:
              - key: GLASSLAB_ORCHESTRATOR_STORE_POSTGRES_DSN
                path: GLASSLAB_ORCHESTRATOR_STORE_POSTGRES_DSN
              - key: GLASSLAB_ORCHESTRATOR_OPERATOR_API_TOKEN
                path: GLASSLAB_ORCHESTRATOR_OPERATOR_API_TOKEN
              - key: GLASSLAB_ORCHESTRATOR_DISCORD_BOT_TOKEN
                path: GLASSLAB_ORCHESTRATOR_DISCORD_BOT_TOKEN
              - key: GLASSLAB_ORCHESTRATOR_DISCORD_WEBHOOK_URL
                path: GLASSLAB_ORCHESTRATOR_DISCORD_WEBHOOK_URL
              - key: GLASSLAB_ORCHESTRATOR_LINK_SIGNING_SECRET
                path: GLASSLAB_ORCHESTRATOR_LINK_SIGNING_SECRET
