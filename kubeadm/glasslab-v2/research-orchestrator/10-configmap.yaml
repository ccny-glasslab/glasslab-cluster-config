apiVersion: v1
kind: ConfigMap
metadata:
  name: glasslab-research-orchestrator-config
  namespace: glasslab-v2
data:
  # The record/event store is Postgres. SQLite is retained only as an import
  # source and local-development fallback.
  GLASSLAB_ORCHESTRATOR_STORE_BACKEND: postgres
  GLASSLAB_ORCHESTRATOR_DATABASE_PATH: /mnt/artifacts/research-orchestrator/state/orchestrator.db
  GLASSLAB_ORCHESTRATOR_WORKSPACE_ROOT: /mnt/artifacts/research-orchestrator/runs
  GLASSLAB_ORCHESTRATOR_ARTIFACT_ROOT: /mnt/artifacts/research-orchestrator/artifacts
  # scripts/cleanup-run-storage.py eligibility window for a terminal run's
  # worktree/runtime scratch space; protocol/reports/shared-artifacts/events
  # are never affected regardless of this setting.
  GLASSLAB_ORCHESTRATOR_TERMINAL_RUN_RETENTION_DAYS: "14"
  GLASSLAB_ORCHESTRATOR_EVIDENCE_EXCERPT_MAX_BYTES: "32768"
  GLASSLAB_ORCHESTRATOR_APPROVED_REPO_PATH: /mnt/artifacts/research-orchestrator/approved-repo
  GLASSLAB_ORCHESTRATOR_APPROVED_REPO_REF: main
  GLASSLAB_ORCHESTRATOR_EVALUATION_CONTRACT_ROOT: /app/evaluation-contracts
  GLASSLAB_ORCHESTRATOR_PROMOTED_CONTRACT_ROOT: /mnt/artifacts/research-orchestrator/trusted-contracts/bundles
  GLASSLAB_ORCHESTRATOR_SEALED_CONTRACT_CANDIDATE_ROOT: /mnt/artifacts/research-orchestrator/contract-candidates
  GLASSLAB_ORCHESTRATOR_TRUSTED_CONTRACT_CATALOG_PATH: /mnt/artifacts/research-orchestrator/trusted-contracts/catalog.json
  GLASSLAB_ORCHESTRATOR_SHARED_MOUNT_ROOT: /mnt/artifacts
  GLASSLAB_ORCHESTRATOR_TASK_BUNDLE_ROOT: /mnt/artifacts/research-orchestrator/task-bundles
  GLASSLAB_ORCHESTRATOR_TASK_ASSET_ROOT: /mnt/artifacts/research-orchestrator/task-assets
  GLASSLAB_ORCHESTRATOR_MAXIMUM_TASK_ASSET_BYTES: "2147483648"
  GLASSLAB_ORCHESTRATOR_DATASET_UPLOAD_ROOT: /mnt/artifacts/research-orchestrator/dataset-uploads
  GLASSLAB_ORCHESTRATOR_MAXIMUM_DATASET_UPLOAD_BYTES: "2147483648"
  GLASSLAB_ORCHESTRATOR_MAXIMUM_DISCORD_DATASET_UPLOAD_BYTES: "104857600"
  GLASSLAB_ORCHESTRATOR_MAXIMUM_DISCORD_ARTIFACT_BUNDLE_BYTES: "25165824"
  GLASSLAB_ORCHESTRATOR_BENCHMARK_DATASET_CATALOG_PATH: /mnt/artifacts/research-orchestrator/datasets/catalog.json
  GLASSLAB_ORCHESTRATOR_DEFAULT_EVALUATION_CONTRACT_ID: example-research-v1
  GLASSLAB_ORCHESTRATOR_DEFAULT_EVALUATION_CONTRACT_VERSION: 1.0.0
  # Hermes owns the inner agent tool-use loop; Glasslab still owns state,
  # approvals, evaluation contracts, jobs, artifacts, and Discord projection.
  GLASSLAB_ORCHESTRATOR_AGENT_RUNTIME_BACKEND: hermes
  GLASSLAB_ORCHESTRATOR_OPENCODE_EXECUTABLE: /usr/local/bin/opencode
  GLASSLAB_ORCHESTRATOR_OPENCODE_START_PORT: "4210"
  GLASSLAB_ORCHESTRATOR_OPENCODE_TURN_TIMEOUT_SECONDS: "1800"
  GLASSLAB_ORCHESTRATOR_OPENCODE_REPEATED_TOOL_LIMIT: "6"
  GLASSLAB_ORCHESTRATOR_OPENCODE_STRUCTURED_REPAIR_ATTEMPTS: "1"
  GLASSLAB_ORCHESTRATOR_OPENCODE_STRUCTURED_OUTPUT_MODE: prompt
  # One shared package/model download cache for every run and both agents
  # instead of a copy per run (see issue #99); session/auth/log state stays
  # per-run regardless of this setting.
  GLASSLAB_ORCHESTRATOR_OPENCODE_SHARED_CACHE_ROOT: /mnt/artifacts/research-orchestrator/opencode-cache
  # OpenCode remains installed only as a rollback runtime.
  GLASSLAB_ORCHESTRATOR_AGENT_MODEL_PROVIDER_ID: exo
  GLASSLAB_ORCHESTRATOR_AGENT_MODEL_NAME: mlx-community/Qwen3-Coder-Next-4bit
  # Hermes connects directly to this OpenAI-compatible Exo endpoint.
  GLASSLAB_ORCHESTRATOR_QWEN_BASE_URL: http://192.168.1.17:52415/v1
  GLASSLAB_ORCHESTRATOR_QWEN_MODEL_NAME: mlx-community/Qwen3-Coder-Next-4bit
  GLASSLAB_ORCHESTRATOR_CLUSTER_EXECUTION_MODE: workflow-api
  GLASSLAB_ORCHESTRATOR_CLUSTER_EXECUTION_API_URL: http://glasslab-workflow-api.glasslab-v2.svc.cluster.local:8080
  GLASSLAB_ORCHESTRATOR_CLUSTER_EXECUTION_WORKLOAD_ID: workspace-cpu-ml-v1
  GLASSLAB_ORCHESTRATOR_CLUSTER_EXECUTION_EXPERIMENT_TYPE: research-workspace-job
  GLASSLAB_ORCHESTRATOR_KUBERNETES_NAMESPACE: glasslab-v2
  GLASSLAB_ORCHESTRATOR_PERMITTED_JOB_IMAGES: ghcr.io/ccny-glasslab/glasslab-research-workspace-runner@sha256:dae5bc4967f5ac54edb6c6d63d8d3db9e4652cc46e035118b0c456eb70121061,ghcr.io/ccny-glasslab/glasslab-research-workspace-runner@sha256:9e7c18d186108847a485ab955194ced2dceee3ed8c8a624a2b0f3ee0e7628b60
  GLASSLAB_ORCHESTRATOR_MAXIMUM_TURNS: "20"
  GLASSLAB_ORCHESTRATOR_MAXIMUM_METHODOLOGY_REVISIONS: "2"
  GLASSLAB_ORCHESTRATOR_MAXIMUM_RUNTIME_SECONDS: "86400"
  GLASSLAB_ORCHESTRATOR_MAXIMUM_CPU: "8"
  GLASSLAB_ORCHESTRATOR_MAXIMUM_MEMORY_GIB: "32"
  GLASSLAB_ORCHESTRATOR_MAXIMUM_GPUS: "1"
  GLASSLAB_ORCHESTRATOR_MAXIMUM_PARALLEL_JOBS: "4"
  GLASSLAB_ORCHESTRATOR_REQUIRE_OPERATOR_AUTH: "true"
  GLASSLAB_ORCHESTRATOR_DISCORD_ENABLED: "true"
  GLASSLAB_ORCHESTRATOR_DISCORD_APPLICATION_ID: "1531982907772502027"
  GLASSLAB_ORCHESTRATOR_DISCORD_GUILD_ID: "1529693375027089458"
  GLASSLAB_ORCHESTRATOR_DISCORD_CHANNEL_ID: "1529939608895488160"
  GLASSLAB_ORCHESTRATOR_DISCORD_CONTROLS_ENABLED: "true"
  # Mystic Arts Masters. Authorization uses the immutable role ID.
  GLASSLAB_ORCHESTRATOR_DISCORD_ADMIN_ROLE_ID: "1529938777714200767"
  GLASSLAB_ORCHESTRATOR_DISCORD_ADMIN_USER_IDS: ""
