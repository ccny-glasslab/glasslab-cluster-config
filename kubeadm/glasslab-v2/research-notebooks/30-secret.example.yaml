# Documentation-only schema. This file is intentionally not a deployable
# Kubernetes Secret. Create the real Secret directly in the cluster (README.md
# shows a command that keeps the token out of shell history), or write an
# ignored file ending in .local.yaml that follows this contract.
research_notebook_secret:
  required_suffix: .local.yaml
  resource:
    api_version: v1
    resource_kind: Secret
    metadata:
      name: notebook-<owner>-token
      namespace: glasslab-notebooks
    string_data:
      JUPYTER_TOKEN: <required-64-hex-random-token>
