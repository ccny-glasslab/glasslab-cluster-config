apiVersion: batch/v1
kind: Job
metadata:
  name: rag-backfill
  namespace: glasslab-v2
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        # Admitted by the glasslab-postgres-ingress allow-list; without this
        # label the Job cannot reach Postgres on 5432.
        app.kubernetes.io/name: rag-backfill
    spec:
      serviceAccountName: glasslab-gpu-runner
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets:
        - name: glasslab-ghcr-pull
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag-backfill
          # Orchestrator image: app/ and scripts/ ship in-image. Pin this to a
          # release that contains scripts/corpus_rag/backfill_rag_from_knowledge.py.
          image: ghcr.io/ccny-glasslab/glasslab-research-orchestrator:ffbbbf38b61c72d4623415eab45da8a168fb3b05
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - /bin/sh
            - -c
            - >
              python /app/scripts/corpus_rag/backfill_rag_from_knowledge.py
              --apply
              --corpus live-knowledge
          env:
            - name: GLASSLAB_ORCHESTRATOR_STORE_BACKEND
              value: postgres
            - name: GLASSLAB_ORCHESTRATOR_STORE_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: glasslab-research-orchestrator
                  key: GLASSLAB_ORCHESTRATOR_STORE_POSTGRES_DSN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 2Gi
              cpu: "1"
            requests:
              memory: 512Mi
              cpu: "250m"
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir: {}
