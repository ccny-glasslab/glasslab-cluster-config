apiVersion: batch/v1
kind: Job
metadata:
  name: metric-search-success
  namespace: glasslab-v2
  labels:
    app: glasslab-metric-search
spec:
  template:
    spec:
      containers:
        - name: metric-search
          image: python:3.11-slim@sha256:9534e5a8e315485d4061ed659af0fd78a284c015f9b73661b41d6bab25604534
          command: ["bash", "-c"]
          args:
            - |
              apt-get update && apt-get install -y git
              pip install torch==2.4.1 torchvision==0.19.1 faiss-cpu==1.8.0.post1 PyYAML==6.0.2 timm==1.0.9 optuna==4.0.0 scikit-learn==1.5.1 pytorch-metric-learning==2.5.0 mlxtend==0.23.1 umap-learn==0.5.6 syne-tune==0.11.2 "ray[tune]==2.32.0" transformers==4.44.2
              git clone https://github.com/OffensiveGeneric/glasslab-metric-search.git /app && git -C /app checkout 99ae4d8dc7184f2f0c01d2fdec80ef6406e7633f
              cd /app
              sed -i 's/art_retrieval_v1/cifar_contrastive_v1/' /app/configs/search_spaces/art_metric_baseline.yaml
              python3 /app/scripts/run_experiment.py \
                --config /app/configs/search_spaces/art_metric_baseline.yaml \
                --output-dir /mnt/artifacts/metric-search-test \
                --epochs 1 \
                --max-train-batches 1 \
                --max-eval-batches 1
          env:
            - name: GLASSLAB_RUNNER_EXPERIMENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "16Gi"
              cpu: "4"
            requests:
              memory: "8Gi"
              cpu: "2"
          volumeMounts:
            - name: artifacts
              mountPath: /mnt/artifacts
            - name: datasets
              mountPath: /mnt/datasets
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-secret
      nodeSelector:
        glasslab.io/gpu-vendor: nvidia
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: glasslab-shared-artifacts
        - name: datasets
          persistentVolumeClaim:
            claimName: glasslab-shared-datasets
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
