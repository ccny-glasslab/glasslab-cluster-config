apiVersion: batch/v1
kind: CronJob
metadata:
  name: corpus-arxiv-sync
  namespace: glasslab-v2
spec:
  # Daily pull of new preprints (06:00 UTC) for the allowlisted categories.
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 7200
      template:
        spec:
          serviceAccountName: glasslab-gpu-runner
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets:
            - name: glasslab-ghcr-pull
          securityContext:
            # Same uid/gid as the orchestrator (10001): staged raw PDFs land on
            # the shared NFS PVC and the orchestrator reads them back, so the
            # job must write as the group that owns that volume.
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: ingest-arxiv
              # The orchestrator image bundles app/ and scripts/ in-image, so
              # the job needs no script ConfigMap. Pin the release commit.
              image: ghcr.io/ccny-glasslab/glasslab-research-orchestrator:d2033ff8b683edaa9b5c3125b50e3a98a402bacc
              imagePullPolicy: IfNotPresent
              workingDir: /app
              command:
                - /bin/sh
                - -c
                - >
                  python /app/scripts/corpus_rag/ingest_arxiv.py
                  --categories cs.LG stat.ML cs.CL cs.AI
                  --days 1
                  --max-results 50
                  --corpus arxiv-preprints
              env:
                # Postgres is the configured store. Raw PDFs stage under the
                # mounted artifacts PVC; no SQLite path and no vector index
                # (lexical chat needs no embeddings).
                - name: GLASSLAB_ORCHESTRATOR_STORE_BACKEND
                  value: postgres
                - name: GLASSLAB_ORCHESTRATOR_CORPUS_RAG_RAW_ROOT
                  value: /mnt/artifacts/research-orchestrator/rag/raw
                - name: GLASSLAB_ORCHESTRATOR_STORE_POSTGRES_DSN
                  valueFrom:
                    secretKeyRef:
                      name: glasslab-research-orchestrator
                      key: GLASSLAB_ORCHESTRATOR_STORE_POSTGRES_DSN
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop: ["ALL"]
              resources:
                limits:
                  memory: 4Gi
                  cpu: "2"
                requests:
                  memory: 2Gi
                  cpu: "1"
              volumeMounts:
                - name: artifacts
                  mountPath: /mnt/artifacts
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: artifacts
              persistentVolumeClaim:
                claimName: glasslab-shared-artifacts
            - name: temporary
              emptyDir: {}
