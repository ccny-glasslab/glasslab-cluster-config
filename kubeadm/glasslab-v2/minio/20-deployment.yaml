apiVersion: apps/v1
kind: Deployment
metadata:
  name: glasslab-minio
  namespace: glasslab-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glasslab-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glasslab-minio
    spec:
      imagePullSecrets:
        - name: glasslab-ghcr-pull
      containers:
        - name: minio
          # MinIO's registries reject anonymous pulls; this is the release that
          # was already running, mirrored into GHCR. See mirror/README.md.
          image: ghcr.io/ccny-glasslab/minio-mirror@sha256:acc08df7821500b6fae33d8eabe6dd0fbf9927d819ec5069de1d097ba4b643db
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: glasslab-v2-minio
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glasslab-v2-minio
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: glasslab-minio-data
