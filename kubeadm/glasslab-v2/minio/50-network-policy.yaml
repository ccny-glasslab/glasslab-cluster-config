apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: glasslab-minio-ingress
  namespace: glasslab-v2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: glasslab-minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: glasslab-v2
          podSelector:
            matchLabels:
              app.kubernetes.io/name: glasslab-workflow-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: glasslab-v2
          podSelector:
            matchLabels:
              app.kubernetes.io/name: glasslab-gpu-runner
        # The workflow-api scoped-user provisioner must reach MinIO to create
        # and rotate its user; without this peer the one-shot Job cannot run.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: glasslab-v2
          podSelector:
            matchLabels:
              app.kubernetes.io/name: glasslab-minio-provisioner
        # ROBOJAN Bob (kubeadm/robojan) and its one-shot bucket/user provisioner.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: robojan
          podSelector:
            matchLabels:
              app.kubernetes.io/name: robojan-bob
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: glasslab-v2
          podSelector:
            matchLabels:
              app.kubernetes.io/name: robojan-bob-minio-provisioner
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001