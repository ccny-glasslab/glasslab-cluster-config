# Documentation-only schema. This file is intentionally not a deployable
# Kubernetes Secret.
#
# This contract is the MinIO ROOT identity. Only the MinIO server itself and the
# one-shot provisioning Job (45-provision-scoped-users-job.yaml) may read it.
# Scoped service identities such as workflow-api live in their own Secrets; see
# kubeadm/glasslab-v2/workflow-api/10-secret.example and
# docs/glasslab-v2/runbooks/provision-minio-scoped-users.md.
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: glasslab-v2-minio
    namespace: glasslab-v2
  required_keys:
    - MINIO_ROOT_USER
    - MINIO_ROOT_PASSWORD
  example_values_are_not_deployable: true
