# Documentation-only schema. This file is intentionally not a deployable
# Kubernetes Secret. Create an ignored file ending in .local.yaml that follows
# this contract, then pass its path through GLASSLAB_GPU_RUNNER_SECRET_FILE.
gpu_runner_secret_file:
  required_suffix: .local.yaml
  resource:
    api_version: v1
    resource_kind: Secret
    metadata:
      name: glasslab-v2-runner
      namespace: glasslab-v2
    string_data:
      GLASSLAB_RUNNER_STORE_POSTGRES_DSN: <required-postgresql-dsn>
