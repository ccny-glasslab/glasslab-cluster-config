apiVersion: apps/v1
kind: Deployment
metadata:
  name: glasslab-interpretation-agent
  namespace: glasslab-v2
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: glasslab-interpretation-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glasslab-interpretation-agent
    spec:
      imagePullSecrets:
        - name: glasslab-ghcr-pull
      containers:
        - name: interpretation-agent
          # Not published yet: service-images.yml builds on push to main and
          # tags with the commit SHA. This marker is allowlisted in
          # scripts/validate-configs.py, and the release path substitutes the
          # merged main SHA; never replace it with a guessed or all-zero SHA.
          image: ghcr.io/ccny-glasslab/glasslab-interpretation-agent:pending-ci-build
          imagePullPolicy: IfNotPresent
          env:
            - name: GLASSLAB_INTERPRETATION_AGENT_PROVIDER_API
              value: openai-compatible
            - name: GLASSLAB_INTERPRETATION_AGENT_PROVIDER_BASE_URL
              value: http://192.168.1.21:52415
            - name: GLASSLAB_INTERPRETATION_AGENT_MODEL
              value: mlx-community/Qwen3-Coder-Next-4bit
            - name: GLASSLAB_INTERPRETATION_AGENT_TIMEOUT_SECONDS
              value: "120"
            - name: GLASSLAB_AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: glasslab-agent-internal-token
                  key: token
          ports:
            - containerPort: 8091
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
