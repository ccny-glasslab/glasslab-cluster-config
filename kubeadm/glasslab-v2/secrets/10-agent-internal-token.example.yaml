# Documentation-only schema. This file is intentionally not a deployable
# Kubernetes Secret. The encrypted SOPS vault owns the live object.
#
# One shared internal token (issue #602) authenticates every workflow-api ->
# stage-agent call and the schedule-worker CronJob -> /run-once call. It is
# injected as the GLASSLAB_AGENT_INTERNAL_TOKEN environment variable into
# intake/interpretation/assessment/design agents and schedule-worker, and as
# GLASSLAB_WORKFLOW_API_AGENT_INTERNAL_TOKEN into workflow-api. Receiving
# services fail closed (503) if the key is missing, so the Secret must exist
# before the enforcing images roll out.
agent_internal_token_secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: glasslab-agent-internal-token
    namespace: glasslab-v2
  required_keys:
    - token
  example_values_are_not_deployable: true
