apiVersion: v1
kind: ConfigMap
metadata:
  name: glasslab-rabbitmq-config
  namespace: glasslab-v2
  labels:
    app.kubernetes.io/name: glasslab-rabbitmq
data:
  # No plugins are enabled. Boot-time local-file definitions import is core
  # RabbitMQ functionality (rabbit_definitions_import_local_filesystem ships
  # in the rabbit application; verified against the pinned 4.3.5 image), so
  # the management plugin is not installed and the management UI/API does not
  # exist in the pod at all. Administration uses kubectl exec rabbitmqctl.
  enabled_plugins: |
    [].
  rabbitmq.conf: |
    # Glasslab task-fabric broker. Single node: persistent, not highly
    # available. See kubeadm/glasslab-v2/rabbitmq/README.md.
    cluster_partition_handling = ignore

    # Resource alarms stop publishers before the node dies of memory or
    # disk pressure; PostgreSQL remains authoritative and outboxes republish.
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.absolute = 2147483648

    # Bounded commands may run long between deliveries; keep the consumer
    # timeout generous but finite, with client heartbeats enforced.
    consumer_timeout = 3600000
    heartbeat = 60

    # Versioned topology is imported at boot from the rendered definitions
    # file produced by the render-definitions init container. Importing
    # definitions at boot also prevents creation of the default guest user.
    # (RabbitMQ 4.3.x: backend alias "local_filesystem", path key
    # "definitions.local.path".)
    definitions.import_backend = local_filesystem
    definitions.local.path = /etc/rabbitmq/rendered/definitions.json

    log.console.level = info
