# Documentation-only schema. This file is intentionally not a deployable
# Kubernetes Secret. Live values are provisioned through the SOPS-managed
# external vault; see docs/glasslab-v2/secrets-and-dr.md.
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: glasslab-v2-rabbitmq
    namespace: glasslab-v2
  required_keys:
    - erlang_cookie
    - topology_admin_password
    - publisher_password
    - consumer_password
    - monitoring_password
  identity_split:
    topology_admin: full broker administration (definitions, vhosts, users)
    publisher: publish to task-fabric exchanges only
    consumer: consume and republish retry/dead-letter work only
    monitor: read-only monitoring
  example_values_are_not_deployable: true
