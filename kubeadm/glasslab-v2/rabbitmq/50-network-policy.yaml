apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: glasslab-rabbitmq-ingress
  namespace: glasslab-v2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: glasslab-rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: glasslab-v2
          podSelector:
            matchLabels:
              app.kubernetes.io/name: glasslab-research-orchestrator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: glasslab-v2
          podSelector:
            matchLabels:
              app.kubernetes.io/name: glasslab-workflow-api
      ports:
        - protocol: TCP
          port: 5672
