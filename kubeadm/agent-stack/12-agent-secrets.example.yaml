# Documentation-only schema. This file is intentionally not a deployable
# Kubernetes Secret. Create the ignored 12-agent-secrets.yaml file from this
# contract, or point GLASSLAB_VLLM_SECRET_FILE at another live Secret manifest.
secret_contract:
  api_version: v1
  resource_kind: Secret
  metadata:
    name: glasslab-agent-secrets
    namespace: glasslab-agents
  required_keys:
    - VLLM_API_KEY
    - HUGGING_FACE_HUB_TOKEN
    - GLASSLAB_AGENT_QWEN_API_KEY
  example_values_are_not_deployable: true
